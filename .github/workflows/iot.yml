name: IoT Simulator

on:
  workflow_dispatch:        # manual trigger
  schedule:
    - cron: "*/15 * * * *"  # runs every 15 minutes (optional)

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t iot-simulator .

      - name: Run IoT Simulator Container
        run: |
          docker run --rm \
            -e DEVICE_1_TOKEN="${{ secrets.DEVICE_1_TOKEN }}" \
            -e DEVICE_2_TOKEN="${{ secrets.DEVICE_2_TOKEN }}" \
            -e DEVICE_3_TOKEN="${{ secrets.DEVICE_3_TOKEN }}" \
            iot-simulator