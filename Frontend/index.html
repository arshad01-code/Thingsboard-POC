<!DOCTYPE html>
<html>
<head>
  <title>IoT Dashboard SaaS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>IoT Dashboard Builder</h1>
  <div id="authArea"></div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="card">
      <h3>Add Widget</h3>
      <input id="title" placeholder="Widget Title">
      <input id="key" placeholder="Telemetry Key">
      <select id="type">
        <option value="gauge">Gauge</option>
        <option value="chart">Chart</option>
        <option value="toggle">Toggle</option>
      </select>
      <button onclick="addWidget()">Add</button>
    </div>

    <div class="card">
      <h3>Save Dashboard</h3>
      <input id="dashName" placeholder="Dashboard Name">
      <button onclick="saveDashboard()">Save</button>
    </div>

  </aside>

  <!-- CANVAS -->
  <main>
    <div id="canvas" class="canvas"></div>
  </main>

</div>

<!-- MODALS -->
<div id="authModal" class="modal hidden">
  <div class="modal-content">
    <h3>Login</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="loader" class="loader hidden"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script src="auth.js"></script>
<script src="dashboard.js"></script>
<script src="drag.js"></script>
<script src="app.js"></script>

</body>
</html>
